name: Generate contribution robot

on:
  schedule:
    # Daily at 08:00 UTC — roughly midnight Pacific.
    - cron: "0 8 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    # Code edits get a fresh render without waiting for the cron.
    paths:
      - "scripts/**"

# A manual run and the cron must not publish over each other. Queue the second
# one rather than cancelling it, so a hand-triggered run always completes.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Render the SVG
        # The generator exits 2 on a missing token, 3 on an API or transport
        # failure and 4 on bad data, so any of those fails the run here and the
        # publish step below never executes. There is deliberately no fallback:
        # a red run beats silently publishing a stale or empty graphic.
        run: |
          python scripts/generate_robot_svg.py \
            --username merna-s-saad \
            --token ${{ secrets.CONTRIBUTION_TOKEN }} \
            --out dist/contribution-robot.svg

      - name: Render the wordmark
        # No token needed -- this is drawn from the bundled 5x7 font, not the
        # API. It is regenerated every run rather than committed once because
        # its month labels track the current date: a frozen copy would drift
        # out of step with the contribution SVG beside it within weeks, which
        # is the whole reason the labels are there.
        run: |
          python scripts/generate_robot_svg.py \
            --username merna-s-saad \
            --word MERNA \
            --out dist/wordmark-robot.svg

      - name: Stamp the run date
        id: stamp
        run: echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Publish to the output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          # Without this the action deletes anything on the output branch that
          # is not in dist/ on this run, so any file added to that branch by
          # hand would vanish on the next cron.
          keep_files: true
          commit_message: "build: regenerate contribution robot ${{ steps.stamp.outputs.date }}"
